# get them with: python3 scripts/optimize_images.py images
- title: "WUFXS 2026: The 2026 International Workshop on UltraFast X-Ray Science"
  location: "East China Normal University, Shanghai, China"
  date: "April 16–19, 2026"
  photos:
    - image: "/images/wufxs-2026/anne-lhuillier.jpg"
      width: 721
      height: 705
      alt: "Kuldeep Prajapat with Prof. Anne L’Huillier, Nobel laureate in Physics, at WUFXS 2026"
      caption: "A dream come true: sharing a moment with Prof. Anne L’Huillier, the 2023 Nobel Prize in Physics laureate whose pioneering work helped establish attosecond science. Meeting one of the scientists whose work has inspired this field was a particularly meaningful moment."
      profile_url: "https://portal.research.lu.se/en/persons/anne-lhuillier/"
      profile_label: "Anne L’Huillier’s profile at Lund University"
    - image: "/images/wufxs-2026/20260418_110414.jpg"
      width: 901
      height: 1600
      alt: "Kuldeep Prajapat with Prof. Mikhail Ivanov at WUFXS 2026 in Shanghai"
      caption: "With Prof. Mikhail (Misha) Ivanov of the Max-Born-Institut. His work in theoretical attosecond physics explores ultrafast electronic dynamics and attosecond spectroscopy."
      profile_url: "https://mbi-berlin.de/p/mikhailivanov"
      profile_label: "Mikhail Ivanov's profile at MBI"
    - image: "/images/wufxs-2026/20260418_195354.jpg"
      width: 901
      height: 1600
      alt: "Kuldeep Prajapat with Dr. Florian Trinter at WUFXS 2026 in Shanghai"
      caption: "With Dr. Florian Trinter, group leader in the Molecular Physics Department at the Fritz-Haber-Institut of the Max Planck Society. His group investigates photoionization-induced dynamics in laser-prepared gas- and aqueous-phase samples using photoelectron spectroscopy and pump–probe methods."
      profile_url: "https://www.fhi.mpg.de/1400561/Group-Members"
      profile_label: "Florian Trinter's group profile at FHI"
    - image: "/images/wufxs-2026/20260418_195933.jpg"
      width: 901
      height: 1600
      alt: "Kuldeep Prajapat with Prof. Lorenz S. Cederbaum at WUFXS 2026 in Shanghai"
      caption: "With Prof. Lorenz S. Cederbaum, whose theoretical work has made major contributions to molecular electronic structure and ultrafast electronic decay processes."
      profile_url: "https://www.pci.uni-heidelberg.de/tc/lenz.html"
      profile_label: "Lorenz S. Cederbaum's profile at Heidelberg University"
    - image: "/images/wufxs-2026/20260418_203053.jpg"
      width: 1200
      height: 1600
      alt: "Kuldeep Prajapat with Dr. Ludger Inhester at WUFXS 2026 in Shanghai"
      caption: "With Dr. Ludger Inhester, a theoretical scientist at DESY working on ultrafast molecular dynamics and X-ray interactions with matter."
      profile_url: "https://desy-theory.cfel.de/team/senior_scientists/dr_ludger_inhester/"
      profile_label: "Ludger Inhester's profile at DESY"
