# Add photographs and captions under the relevant conference's photos list.
# Upload photos as they come from your phone or camera (HEIC or JPEG). The GitHub Pages build
# converts HEIC to .jpg, resizes to 1600 px on the long side and strips location metadata
# (scripts/optimize_images.py), so always point `image` at a .jpg path.
