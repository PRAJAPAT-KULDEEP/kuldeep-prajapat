      width: 1145
      height: 1600
      alt: "Kuldeep Prajapat with Prof. Jan-Michael Rost at IAMNOP 2025"
      caption: "With Prof. Jan-Michael Rost, whose theoretical research addresses the dynamics of finite quantum systems, including atoms, molecules, and clusters."
      profile_url: "https://www.pks.mpg.de/finite-systems/people/prof-dr-jan-michael-rost/"
