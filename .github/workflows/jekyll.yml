# Build and deploy the Academic Pages / Jekyll site to GitHub Pages
name: Deploy Academic Pages template site to Pages

on:
  push:
    branches: ["master"]
  # Pull requests get a test build (no deploy), so a broken change is caught before merging.
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Make photos web-ready on the build copy only (the originals in the repo are unchanged):
      # HEIC -> JPEG, long side at most 1600 px, metadata such as GPS location removed.
      - name: Optimize photos for the web
        run: |
          python3 -m venv /tmp/imgenv
          /tmp/imgenv/bin/pip install --quiet pillow pillow-heif
          /tmp/imgenv/bin/python scripts/optimize_images.py images --in-place

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      # The site moved from /kuldeep-prajapat/ to the root on 5 Nov 2026. Old page addresses
      # forward via `redirect_from` in each page; files can't forward, so keep copies at the
      # old paths (outside the sitemap) so shared links to the CV, feed and photos still work.
      - name: Keep old links to files working
        run: |
          set -euo pipefail
          mkdir -p _site/kuldeep-prajapat/files
          cp _site/files/kuldeep-prajapat-cv.pdf _site/kuldeep-prajapat/files/
          cp _site/feed.xml _site/kuldeep-prajapat/feed.xml
          cp -r _site/images _site/kuldeep-prajapat/images
          ls _site/kuldeep-prajapat
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
