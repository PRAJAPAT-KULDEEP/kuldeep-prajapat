# Workflow for building and deploying an Academic Pages / Jekyll site to GitHub Pages
name: Deploy Academic Pages template site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install HEIC converter
        run: |
          sudo apt-get update
          sudo apt-get install --yes libheif-examples
      - name: Convert WUFXS originals to full-resolution PNG
        run: |
          heif-convert images/wufxs-2026/20260418_110414.heic images/wufxs-2026/20260418_110414.png
          heif-convert images/wufxs-2026/20260418_195354.heic images/wufxs-2026/20260418_195354.png
          file images/wufxs-2026/20260418_110414.png images/wufxs-2026/20260418_195354.png
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
