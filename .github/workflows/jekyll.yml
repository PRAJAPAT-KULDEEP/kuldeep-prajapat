# Build and deploy the Academic Pages / Jekyll site to GitHub Pages
name: Deploy Academic Pages template site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Convert HEIC originals to full-resolution PNGs. Original files stay untouched.
      - name: Install HEIC conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libheif-examples libheif-plugin-libde265
      - name: Convert HEIC photos for browser compatibility
        run: |
          set -euo pipefail
          heif-convert images/wufxs-2026/20260418_110414.heic images/wufxs-2026/20260418_110414.png
          heif-convert images/wufxs-2026/20260418_195354.heic images/wufxs-2026/20260418_195354.png
          heif-convert images/wufxs-2026/20260418_195933.heic images/wufxs-2026/20260418_195933.png
          heif-convert images/wufxs-2026/20260418_203053.heic images/wufxs-2026/20260418_203053.png
          file images/wufxs-2026/20260418_110414.png images/wufxs-2026/20260418_195354.png images/wufxs-2026/20260418_195933.png images/wufxs-2026/20260418_203053.png

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
